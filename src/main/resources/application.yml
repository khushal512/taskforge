server:
  port: ${SERVER_PORT:8080}

spring:
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/taskforge}
    username: ${DATABASE_USERNAME:taskforge}
    password: ${DATABASE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

taskforge:
  worker:
    scheduling-enabled: ${WORKER_SCHEDULING_ENABLED:true}
    poll-delay-ms: ${WORKER_POLL_DELAY_MS:1000}
