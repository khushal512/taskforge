services:
  postgres:
    image: postgres:17.11
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-taskforge}
      POSTGRES_USER: ${DATABASE_USERNAME:-taskforge}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in your shell or ignored .env file}
    ports:
      - "127.0.0.1:${DATABASE_PORT:-5432}:5432"
    volumes:
      - taskforge-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  taskforge-postgres:
